<script>
function playWelcomeSound() {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    [523.25, 659.25, 783.99, 1046.5].forEach((frequency, index) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.type = "sine";
        oscillator.frequency.value = frequency;

        const start = audioContext.currentTime + index * 0.12;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.15, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);

        oscillator.start(start);
        oscillator.stop(start + 0.4);
    });
}

document.getElementById("startCelebration").addEventListener("click", () => {
    playWelcomeSound();

    document.getElementById("welcomeScreen").classList.add("hide");

});
</script>

<script>
const birthdayDate = new Date(2026, 10, 1, 0, 0, 0);

function updateCountdown() {
    const now = new Date();
    const difference = birthdayDate - now;

    if (difference <= 0) {
        document.querySelector(".countdown-section h2").textContent =
            "كل سنة وأنا طيب! 🎂❤️";
        ["days", "hours", "minutes", "seconds"].forEach(id => {
            document.getElementById(id).textContent = "00";
        });
        return;
    }

    document.getElementById("days").textContent =
        Math.floor(difference / 86400000);

    document.getElementById("hours").textContent =
        Math.floor((difference / 3600000) % 24);

    document.getElementById("minutes").textContent =
        Math.floor((difference / 60000) % 60);

    document.getElementById("seconds").textContent =
        Math.floor((difference / 1000) % 60);
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

<canvas id="celebrationCanvas"></canvas>

<script>
const canvas = document.getElementById("celebrationCanvas");
const ctx = canvas.getContext("2d");

let pieces = [];
let animationId;
let startTime;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function createCelebration() {
    pieces = [];

    for (let i = 0; i < 180; i++) {
        pieces.push({
            x: Math.random() * canvas.width,
            y: -Math.random() * canvas.height,
            size: Math.random() * 8 + 4,
            speed: Math.random() * 4 + 2,
            rotation: Math.random() * 360,
            spin: Math.random() * 8 - 4,
            color: ["#d4af37", "#ffe7a0", "#ffffff", "#b8860b"][
                Math.floor(Math.random() * 4)
            ]
        });
    }

    startTime = Date.now();
    animateCelebration();
}

function animateCelebration() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    pieces.forEach(piece => {
        ctx.save();
        ctx.translate(piece.x, piece.y);
        ctx.rotate(piece.rotation * Math.PI / 180);
        ctx.fillStyle = piece.color;
        ctx.fillRect(-piece.size / 2, -piece.size / 2,
                     piece.size, piece.size * 1.7);
        ctx.restore();

        piece.y += piece.speed;
        piece.x += Math.sin(piece.y / 35) * 1.5;
        piece.rotation += piece.spin;
    });

    if (Date.now() - startTime < 5000) {
        animationId = requestAnimationFrame(animateCelebration);
    } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
}

window.addEventListener("load", createCelebration);
</script>

<style>

    transition: opacity 1s ease, transform 1s ease;

    opacity: 1;
    transform: translateY(0);

<script>
const revealItems = document.querySelectorAll(
    "h1, h2, p, .gallery, .countdown-section, .music-player"
);

revealItems.forEach(item => item.classList.add("reveal"));

const revealObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add("show");
            revealObserver.unobserve(entry.target);
        }
    });
}, { threshold: 0.15 });

revealItems.forEach(item => revealObserver.observe(item));
</script>

            const star = document.createElement("span");
            star.className = "music-burst";
            star.textContent = ["✦", "✧", "✨"][i % 3];

            star.style.left = centerX + "px";
            star.style.top = centerY + "px";
            star.style.setProperty("--move-x", (Math.random() * 220 - 110) + "px");
            star.style.setProperty("--move-y", (Math.random() * 180 - 90) + "px");

            document.body.appendChild(star);
            setTimeout(() => star.remove(), 1300);
        }
    });
}
</script>

if (!firebase.apps.length) firebase.initializeApp(birthdayFirebaseConfig);
const birthdayDb = firebase.firestore();

const visitorForm = document.getElementById("visitorMessageForm");
if (visitorForm) {
  visitorForm.addEventListener("submit", async function(event) {
    event.preventDefault();
    const nameInput = document.getElementById("visitorName");
    const messageInput = document.getElementById("visitorMessage");
    const sendButton = document.getElementById("sendVisitorMessage");
    const status = document.getElementById("visitorMessageStatus");
    const name = nameInput.value.trim();
    const message = messageInput.value.trim();

    if (!name || !message) {
      status.textContent = "من فضلك اكتب اسمك ورسالتك.";
      return;
    }

    sendButton.disabled = true;
    status.textContent = "جاري إرسال رسالتك...";
    try {
      await birthdayDb.collection("messages").add({
        name: name,
        message: message,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      visitorForm.reset();
      status.textContent = "وصلت رسالتك بنجاح! شكراً لمشاركتك ❤️";
    } catch (error) {
      console.error("Message submission failed:", error);
      status.textContent = "حصلت مشكلة في الإرسال. جرّب مرة تانية بعد قليل.";
    } finally {
      sendButton.disabled = false;
