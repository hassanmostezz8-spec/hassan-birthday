<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة رسائل عيد الميلاد</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 30px 16px;
      background: radial-gradient(ellipse at top, #18243b, #080b14 70%);
      color: #fff; font-family: Tahoma, Arial, sans-serif;
    }
    .wrap {
      width: min(100%, 850px); margin: 30px auto; padding: 26px;
      background: rgba(255,255,255,.045); border: 1px solid #bd9138;
      border-radius: 22px; box-shadow: 0 0 28px rgba(212,175,55,.13);
    }
    h1 { text-align: center; color: #f5d27a; }
    p { line-height: 1.8; color: #e9d9b5; }
    input {
      display: block; width: 100%; margin: 12px 0; padding: 13px;
      border-radius: 10px; border: 1px solid #bd9138; background: #111827;
      color: white; font: inherit;
    }
    button {
      border: 0; border-radius: 22px; padding: 12px 22px; margin: 8px 4px;
      background: linear-gradient(135deg,#d4af37,#f5df91);
      color: #17120a; font: inherit; font-weight: bold; cursor: pointer;
    }
    .message {
      margin: 14px 0; padding: 17px; border: 1px solid rgba(212,175,55,.45);
      border-radius: 14px; background: rgba(0,0,0,.35);
    }
    .message strong { color: #f5d27a; }
    .message p { white-space: pre-wrap; overflow-wrap: anywhere; }
    .muted { color: #b8b8c5; font-size: 13px; }
    #status { min-height: 24px; color: #f5d27a; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>♛ رسائل الزوار ♛</h1>
    <p>صفحة خاصة لعرض رسائل التهنئة. سجّل الدخول بحساب المدير الذي أنشأته في Firebase Authentication.</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username" required>
      <input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>
      <button type="submit">تسجيل الدخول</button>
    </form>

    <section id="adminPanel" hidden>
      <p id="welcome"></p>
      <button id="logoutButton" type="button">تسجيل الخروج</button>
      <div id="messagesList"></div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="muted">لا تشارك كلمة مرور المدير مع أي شخص.</p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyAowyy2IIk3QKP4xmkskeuwIn6yv8BmPcU",
  authDomain: "hassan-birthday.firebaseapp.com",
  projectId: "hassan-birthday",
  storageBucket: "hassan-birthday.firebasestorage.app",
  messagingSenderId: "56971121871",
  appId: "1:56971121871:web:137a0c961707a43fed53ba",
  measurementId: "G-MQ5EVEM3JR"
};
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const loginForm = document.getElementById("loginForm");
    const adminPanel = document.getElementById("adminPanel");
    const statusEl = document.getElementById("status");
    const messagesList = document.getElementById("messagesList");

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "جاري تسجيل الدخول...";
      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
      } catch (error) {
        statusEl.textContent = "تعذر تسجيل الدخول. راجع البريد وكلمة المرور.";
      }
    });

    document.getElementById("logoutButton").addEventListener("click", () => auth.signOut());

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        loginForm.hidden = false;
        adminPanel.hidden = true;
        messagesList.replaceChildren();
        statusEl.textContent = "";
        return;
      }

      loginForm.hidden = true;
      adminPanel.hidden = false;
      document.getElementById("welcome").textContent = "تم تسجيل الدخول: " + user.email;
      statusEl.textContent = "جاري تحميل الرسائل...";

      try {
        const snapshot = await db.collection("messages").orderBy("createdAt", "desc").get();
        messagesList.replaceChildren();
        if (snapshot.empty) {
          statusEl.textContent = "لسه مفيش رسائل.";
          return;
        }
        snapshot.forEach((doc) => {
          const data = doc.data();
          const card = document.createElement("article");
          card.className = "message";
          const heading = document.createElement("strong");
          heading.textContent = data.name || "زائر";
          const body = document.createElement("p");
          body.textContent = data.message || "";
          const date = document.createElement("div");
          date.className = "muted";
          date.textContent = data.createdAt && data.createdAt.toDate
            ? data.createdAt.toDate().toLocaleString("ar-EG")
            : "وقت الإرسال غير متاح";
          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "حذف الرسالة";
          remove.addEventListener("click", async () => {
            if (!confirm("هل تريد حذف هذه الرسالة؟")) return;
            try {
              await db.collection("messages").doc(doc.id).delete();
              card.remove();
            } catch (error) {
              statusEl.textContent = "تعذر حذف الرسالة.";
            }
          });
          card.append(heading, body, date, remove);
          messagesList.appendChild(card);
        });
        statusEl.textContent = "عدد الرسائل: " + snapshot.size;
      } catch (error) {
        console.error(error);
        statusEl.textContent = "تعذر تحميل الرسائل. تأكد من نشر قواعد Firestore باستخدام UID حساب المدير الصحيح.";
      }
    });
  </script>
</body>
</html>
